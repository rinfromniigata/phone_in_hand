<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="990" viewBox="0 0 1680 990" font-family='"IBM Plex Sans JP","Noto Sans JP","Yu Gothic UI",sans-serif'><defs><marker id="a_video" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f62fe"/></marker><marker id="a_video_s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0f62fe"/></marker><marker id="a_pose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198038"/></marker><marker id="a_pose_s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#198038"/></marker><marker id="a_ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#525252"/></marker><marker id="a_ctrl_s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#525252"/></marker><marker id="a_osc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a3ffc"/></marker><marker id="a_osc_s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a3ffc"/></marker></defs><rect width="1680" height="990" fill="#ffffff"/><text x="40" y="58" font-size="24" font-weight="600" fill="#161616">phone_in_hand システム構成概略図</text><text x="40" y="84" font-size="13" fill="#525252">映像の取り込みは3通りから選ぶ。位置の基準は既定でコントローラー固定、ハンドトラッキングはオプトイン。パネルは自分にだけ見え、他のユーザーにはアバターのスマホの3Dモデルだけが見える。</text><rect x="30" y="110" width="320" height="410" fill="#f4f4f4" stroke="#c6c6c6" stroke-width="1.5"/><text x="44" y="136" font-size="17" font-weight="600" fill="#161616">Android スマホ</text><rect x="46" y="145" width="288" height="48" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="174.0" font-size="15" font-weight="400" fill="#161616">画面（HDMI出力）</text><rect x="46" y="205" width="288" height="48" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="226.0" font-size="15" font-weight="400" fill="#161616">ADB</text><text x="58" y="245.0" font-size="12" fill="#525252">ワイヤレスデバッグ／USBデバッグ</text><rect x="46" y="265" width="288" height="48" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="286.0" font-size="15" font-weight="400" fill="#161616">scrcpy-server</text><text x="58" y="305.0" font-size="12" fill="#525252">PCが送り込み、画面を映像にして返す</text><rect x="46" y="325" width="288" height="58" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="351.0" font-size="15" font-weight="400" fill="#161616">センサー送信アプリ</text><text x="58" y="370.0" font-size="12" fill="#525252">ハンドトラッキング時のみ。PCがADBで入れる</text><rect x="46" y="395" width="288" height="58" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="421.0" font-size="15" font-weight="400" fill="#161616">画面の設定</text><text x="58" y="440.0" font-size="12" fill="#525252">「タップを表示」・画面を消さない（ADBで切替）</text><rect x="46" y="465" width="288" height="40" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="490.0" font-size="13" font-weight="400" fill="#161616">ロック解除：指紋・PIN・Extend Unlock</text><rect x="30" y="545" width="320" height="170" fill="#f4f4f4" stroke="#c6c6c6" stroke-width="1.5"/><text x="44" y="571" font-size="17" font-weight="600" fill="#161616">iPhone</text><rect x="46" y="580" width="288" height="48" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="609.0" font-size="15" font-weight="400" fill="#161616">画面（HDMI出力）</text><rect x="46" y="640" width="288" height="58" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="58" y="666.0" font-size="15" font-weight="400" fill="#161616">AirPlay（画面ミラーリング）</text><text x="58" y="685.0" font-size="12" fill="#525252">顔認証は不可：Apple Watch・自動ロック</text><rect x="30" y="745" width="320" height="58" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="42" y="771.0" font-size="15" font-weight="400" fill="#161616">スマホホルダー（既定）</text><text x="42" y="790.0" font-size="12" fill="#525252">スマホをコントローラーに固定する</text><rect x="380" y="140" width="240" height="60" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="392" y="167.0" font-size="15" font-weight="400" fill="#161616">UVCキャプチャ機器</text><text x="392" y="186.0" font-size="12" fill="#525252">HDMI → USB</text><rect x="380" y="600" width="220" height="80" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="392" y="637.0" font-size="15" font-weight="400" fill="#161616">AirPlay受信ソフト</text><text x="392" y="656.0" font-size="12" fill="#525252">利用者が別途導入（同梱しない）</text><rect x="670" y="110" width="580" height="800" fill="#edf5ff" stroke="#c6c6c6" stroke-width="1.5"/><text x="684" y="136" font-size="17" font-weight="600" fill="#161616">PCアプリ Phone in Hand（Tauri 2・Windows x64）</text><rect x="690" y="145" width="540" height="50" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="167.0" font-size="15" font-weight="400" fill="#161616">UI：SvelteKit＋carbon-components-svelte</text><text x="702" y="186.0" font-size="12" fill="#525252">Paraglide JS（日・英・簡体字中国語）</text><rect x="690" y="210" width="540" height="50" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="232.0" font-size="15" font-weight="400" fill="#161616">app_state</text><text x="702" y="251.0" font-size="12" fill="#525252">状態を集約してUIへ通知／UIの操作をコマンドで受ける</text><text x="690" y="292" font-size="12" font-weight="600" fill="#525252">video_source（設定で切り替え）</text><rect x="690" y="300" width="240" height="45" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="327.5" font-size="14" font-weight="400" fill="#161616">hdmi_capture_source</text><rect x="690" y="365" width="240" height="45" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="392.5" font-size="14" font-weight="400" fill="#161616">android_mirror_source</text><rect x="690" y="430" width="240" height="45" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="457.5" font-size="14" font-weight="400" fill="#161616">window_capture_source</text><rect x="960" y="365" width="270" height="45" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="972" y="384.5" font-size="15" font-weight="400" fill="#161616">frame_processor</text><text x="972" y="403.5" font-size="12" fill="#525252">切り抜き・黒画面／信号断の検出</text><text x="690" y="512" font-size="12" font-weight="600" fill="#525252">pose_source（設定で切り替え）</text><rect x="690" y="520" width="240" height="40" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="545.0" font-size="13" font-weight="400" fill="#161616">controller_pose_source（既定）</text><rect x="690" y="572" width="240" height="40" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="597.0" font-size="14" font-weight="400" fill="#161616">hand_pose_source</text><rect x="690" y="650" width="240" height="50" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="672.0" font-size="14" font-weight="400" fill="#161616">phone_orientation_source</text><text x="702" y="691.0" font-size="12" fill="#525252">UDP受信・トークン検証</text><rect x="960" y="545" width="270" height="55" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="972" y="569.5" font-size="15" font-weight="400" fill="#161616">overlay_presenter</text><text x="972" y="588.5" font-size="12" fill="#525252">表示・薄く表示・非表示</text><rect x="960" y="650" width="270" height="50" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="972" y="672.0" font-size="15" font-weight="400" fill="#161616">pose_fusion</text><text x="972" y="691.0" font-size="12" fill="#525252">位置合わせ・ヨー補正・代用・固定</text><rect x="690" y="740" width="240" height="55" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="764.5" font-size="14" font-weight="400" fill="#161616">adb_controller</text><text x="702" y="783.5" font-size="12" fill="#525252">ペア設定・インストール・設定切替</text><rect x="960" y="740" width="270" height="55" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="972" y="764.5" font-size="14" font-weight="400" fill="#161616">vrchat_bridge</text><text x="972" y="783.5" font-size="12" fill="#525252">OSC送信・OSCQuery</text><rect x="690" y="820" width="540" height="45" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="702" y="839.5" font-size="14" font-weight="400" fill="#161616">settings_store</text><text x="702" y="858.5" font-size="12" fill="#525252">設定・位置合わせの結果・ADBの鍵（ユーザー領域にだけ保存）</text><rect x="1290" y="110" width="360" height="370" fill="#f4f4f4" stroke="#c6c6c6" stroke-width="1.5"/><text x="1304" y="136" font-size="17" font-weight="600" fill="#161616">SteamVR</text><rect x="1306" y="145" width="328" height="55" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="169.5" font-size="15" font-weight="400" fill="#161616">オーバーレイ</text><text x="1318" y="188.5" font-size="12" fill="#525252">スマホの画面パネル（自分にだけ見える）</text><rect x="1306" y="212" width="328" height="48" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="241.0" font-size="15" font-weight="400" fill="#161616">コントローラーの姿勢</text><rect x="1306" y="272" width="328" height="62" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="300.0" font-size="15" font-weight="400" fill="#161616">ハンドトラッキング（Skeletal Input）</text><text x="1318" y="319.0" font-size="12" fill="#525252">Steam Link／Virtual Desktop経由のみ</text><rect x="1306" y="346" width="328" height="55" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="370.5" font-size="15" font-weight="400" fill="#161616">ヘッドセット</text><text x="1318" y="389.5" font-size="12" fill="#525252">Quest・Rift Sなど（接続方法は問わない）</text><rect x="1306" y="413" width="328" height="50" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="435.0" font-size="14" font-weight="400" fill="#161616">表示の重ね合わせ</text><text x="1318" y="454.0" font-size="12" fill="#525252">HMDの視界にパネルを描く</text><rect x="1290" y="520" width="360" height="250" fill="#f4f4f4" stroke="#c6c6c6" stroke-width="1.5"/><text x="1304" y="546" font-size="17" font-weight="600" fill="#161616">VRChat</text><rect x="1306" y="555" width="328" height="50" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="585.0" font-size="15" font-weight="400" fill="#161616">OSC受信・OSCQuery</text><rect x="1306" y="617" width="328" height="60" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="644.0" font-size="15" font-weight="400" fill="#161616">アバター</text><text x="1318" y="663.0" font-size="12" fill="#525252">スマホの3Dモデル（Visible・IsLeftで切替）</text><rect x="1306" y="689" width="328" height="62" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1318" y="717.0" font-size="15" font-weight="400" fill="#161616">他のユーザー</text><text x="1318" y="736.0" font-size="12" fill="#525252">手にスマホが見える（画面の中身は見えない）</text><rect x="1290" y="805" width="360" height="58" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.5"/><text x="1302" y="831.0" font-size="15" font-weight="400" fill="#161616">アバター用パッケージ（.unitypackage）</text><text x="1302" y="850.0" font-size="12" fill="#525252">Modular Avatarで非破壊に組み込む</text><polyline points="334,169 380,169" fill="none" stroke="#0f62fe" stroke-width="2.25" marker-end="url(#a_video)"/><text x="338" y="160" font-size="12" fill="#0f62fe" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4">HDMI</text><polyline points="334,604 362,604 362,190 380,190" fill="none" stroke="#0f62fe" stroke-width="2.25" marker-end="url(#a_video)"/><text x="338" y="596" font-size="12" fill="#0f62fe" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4">HDMI</text><polyline points="620,170 650,170 650,322 690,322" fill="none" stroke="#0f62fe" stroke-width="2.2