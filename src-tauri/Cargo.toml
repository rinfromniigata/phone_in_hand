[package]
name = "phone_in_hand"
description = "VRの中で、手に持ったスマホの画面を見るためのSteamVRオーバーレイ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "phone_in_hand_lib"
# Windowsのデスクトップだけが対象のため、モバイル用の staticlib・cdylib は作らない
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
pih_core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-os = "2.4.0"
