[package]
name = "phone_in_hand"
description = "VRの中で、手に持ったスマホの画面を見るためのSteamVRオーバーレイ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "phone_in_hand_lib"
# Windowsのデスクトップだけが対象のため、モバイル用の staticlib・cdylib は作らない
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
cc = "1.11.2"

[dependencies]
pih_core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-os = "2.4.0"
jpeg-encoder = "0.7.1"
base64 = "0.23.1"

[dependencies.windows]
version = "0.62.2"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3.27.0"
