[workspace]
resolver = "3"
members = ["crates/pih_core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/rinfromniigata/phone_in_hand"

[workspace.dependencies]
pih_core = { path = "crates/pih_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
